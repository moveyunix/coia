<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开放智算产业联盟 COIA</title>
  <style>
    :root{
      --bg:#f4f7fb; --card:#fff; --text:#10233f; --muted:#4f647d;
      --brand:#10bcd6; --line:#d9e3ef; --brand-dark:#0a7fa0;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
    .container{width:min(1120px,92%);margin:0 auto}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .topbar-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{height:40px}
    .nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .nav a{color:var(--muted);text-decoration:none}
    .lang-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer}
    .hero{padding:62px 0;background:linear-gradient(135deg,#102544,#0c1a31 50%,#153763);color:#fff}
    .hero h1{margin:0 0 10px;font-size:clamp(1.8rem,4vw,2.8rem)}
    .hero p{margin:0;line-height:1.8;color:#d8e8ff;max-width:900px}
    section{padding:52px 0}
    .section-title{margin:0 0 10px;font-size:1.62rem}
    .section-desc{margin:0;color:var(--muted);line-height:1.75}
    .anchor-offset{scroll-margin-top:84px}

    .logo-group{
      margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;
      box-shadow:0 6px 20px rgba(16,35,63,.04);
    }
    .logo-group h3{margin:0 0 12px;color:#1f3c63;font-size:1.06rem}
    .logo-grid{
      display:grid;gap:12px;
      grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    }
    .logo-item{
      min-height:88px;background:#fff;border:1px solid #e5edf7;border-radius:12px;
      display:flex;align-items:center;justify-content:center;padding:10px;
      transition:.2s ease;
    }
    .logo-item:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(10,31,56,.07);border-color:#cfe0f1}
    .logo-item img{max-width:100%;max-height:56px;object-fit:contain;display:block}

    .note{margin-top:8px;color:var(--muted);font-size:.93rem}
    .loading{display:inline-block;margin-top:10px;padding:8px 12px;border:1px solid #d6e7f8;background:#eef7ff;color:#2a557f;border-radius:8px}
    .warn{margin-top:10px;padding:10px 12px;border:1px solid #ffe4ba;background:#fff8eb;color:#8a4b00;border-radius:8px;line-height:1.65}
    .hidden{display:none!important}
    .footer{margin-top:20px;background:#0a1830;color:#b8c9e5;padding:28px 0}
    @media (max-width:920px){
      .topbar-inner{flex-direction:column;align-items:flex-start;padding:10px 0}
      .logo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <img src="coia-logo.png" alt="COIA Logo" onerror="this.style.display='none'"/>
        <strong data-i18n="siteName">开放智算产业联盟</strong>
      </div>
      <nav class="nav">
        <a href="#members" data-i18n="navMembers">会员单位</a>
        <button class="lang-btn" id="langBtn">EN</button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1 data-i18n="heroTitle">开放智算产业联盟（COIA）</h1>
      <p data-i18n="heroDesc">面向企业级 AI 与大模型落地，构建开放、协同、可持续的产业生态，推动技术创新、标准共建与应用规模化。</p>
    </div>
  </section>

  <section id="members" class="anchor-offset">
    <div class="container">
      <h2 class="section-title" data-i18n="membersTitle">会员单位 Logo 墙（人工精修版）</h2>
      <p class="section-desc" data-i18n="membersDesc">已按固定裁切坐标拆分并排版，效果比自动识别更稳定。</p>
      <div class="note" data-i18n="membersTip">请把整合图保存为 members-all.png 放在同目录。</div>
      <div id="loading" class="loading" data-i18n="loading">正在加载并裁切 Logo...</div>
      <div id="warn" class="warn hidden" data-i18n="warn">未找到 members-all.png 或加载失败，请检查文件名和路径。</div>

      <div class="logo-group">
        <h3 data-i18n="groupBoard">理事成员</h3>
        <div class="logo-grid" id="grid-board"></div>
      </div>

      <div class="logo-group">
        <h3 data-i18n="groupGeneral">普通成员</h3>
        <div class="logo-grid" id="grid-general"></div>
      </div>

      <div class="logo-group">
        <h3 data-i18n="groupPartner">伙伴成员</h3>
        <div class="logo-grid" id="grid-partner"></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div data-i18n="foot">© 2026 COIA. 保留所有权利。</div>
    </div>
  </footer>

  <script>
    // ===== i18n =====
    const i18n = {
      zh: {
        siteName:"开放智算产业联盟",
        navMembers:"会员单位",
        heroTitle:"开放智算产业联盟（COIA）",
        heroDesc:"面向企业级 AI 与大模型落地，构建开放、协同、可持续的产业生态，推动技术创新、标准共建与应用规模化。",
        membersTitle:"会员单位 Logo 墙（人工精修版）",
        membersDesc:"已按固定裁切坐标拆分并排版，效果比自动识别更稳定。",
        membersTip:"请把整合图保存为 members-all.png 放在同目录。",
        loading:"正在加载并裁切 Logo...",
        warn:"未找到 members-all.png 或加载失败，请检查文件名和路径。",
        groupBoard:"理事成员",
        groupGeneral:"普通成员",
        groupPartner:"伙伴成员",
        foot:"© 2026 COIA. 保留所有权利。"
      },
      en: {
        siteName:"COIA",
        navMembers:"Members",
        heroTitle:"COIA — Cooperative Open Intelligent Industry Alliance",
        heroDesc:"Focused on enterprise AI and LLM adoption, COIA builds an open and collaborative ecosystem for innovation, standards, and scaled applications.",
        membersTitle:"Member Logo Wall (Manual Fine-tuned)",
        membersDesc:"Split with fixed hand-tuned crop boxes for stable and clean presentation.",
        membersTip:"Save your merged image as members-all.png in the same folder.",
        loading:"Loading and cropping logos...",
        warn:"members-all.png not found or failed to load. Please check filename/path.",
        groupBoard:"Board Members",
        groupGeneral:"General Members",
        groupPartner:"Partner Members",
        foot:"© 2026 COIA. All rights reserved."
      }
    };
    let lang = "zh";
    function renderLang(){
      document.querySelectorAll("[data-i18n]").forEach(el=>{
        const key = el.dataset.i18n;
        if(i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中";
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    }
    document.getElementById("langBtn").addEventListener("click",()=>{
      lang = lang === "zh" ? "en" : "zh";
      renderLang();
    });
    renderLang();

    // ===== Manual crop boxes =====
    // 基准尺寸：你给的图约为 1766 x 843（按该比例人工精修）
    // 坐标格式: [x, y, w, h]
    const BOXES = {
      board: [
        [80,  55, 180, 98],   // ByteDance
        [245, 52, 235, 104],  // China Mobile
        [475, 34, 160, 135],  // China Unicom
        [625, 52, 170, 100],  // Digital China
        [790, 60, 165, 85],   // H3C
        [950, 56, 170, 86],   // Intel
        [1110,55, 205, 100],  // OpenAnolis
        [1315,48, 245, 110],  // UnionTech
        [1555,56, 175, 84]    // ZTE
      ],
      general: [
        // Row 1
        [110,220,120,90], [225,225,120,80], [340,225,145,80], [485,220,130,82],
        [615,220,165,85], [790,220,155,85], [950,220,130,85], [1080,220,150,85],
        [1230,220,155,85], [1385,220,145,85], [1530,220,190,85],
        // Row 2
        [90,320,170,78], [255,320,165,78], [420,320,140,78], [560,305,140,98],
        [700,320,170,78], [865,320,120,78], [980,320,145,78], [1125,318,150,82],
        [1275,318,180,82], [1455,318,170,82],
        // Row 3
        [110,405,250,78], [360,410,160,70], [520,405,160,78], [680,405,190,78],
        [910,405,150,78], [1060,405,145,78], [1215,405,170,78], [1385,400,235,85],
        // Row 4
        [120,500,150,82], [295,500,140,82], [465,500,170,82], [670,500,160,82],
        [840,500,160,82], [1020,500,165,82]
      ],
      partner: [
        // Row 1
        [105,625,210,95], [300,620,470,95], [775,625,185,95],
        [960,620,190,95], [1160,625,300,95], [1520,620,200,95],
        // Row 2
        [105,730,220,90], [330,730,175,90], [510,730,280,90]
      ]
    };

    function cropToDataURL(img, box, pad=4){
      const [x,y,w,h] = box;
      const sx = Math.max(0, x - pad);
      const sy = Math.max(0, y - pad);
      const sw = Math.min(img.naturalWidth - sx, w + pad * 2);
      const sh = Math.min(img.naturalHeight - sy, h + pad * 2);

      const c = document.createElement("canvas");
      c.width = sw; c.height = sh;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      return c.toDataURL("image/png");
    }

    function renderGroup(gridId, boxes, img){
      const grid = document.getElementById(gridId);
      grid.innerHTML = "";
      boxes.forEach((b,idx)=>{
        const item = document.createElement("div");
        item.className = "logo-item";
        const im = new Image();
        im.alt = "member-logo-" + (idx + 1);
        im.src = cropToDataURL(img, b, 4);
        item.appendChild(im);
        grid.appendChild(item);
      });
    }

    function buildLogoWall(){
      const img = new Image();
      img.src = "members-all.png";
      const loading = document.getElementById("loading");
      const warn = document.getElementById("warn");

      img.onload = () => {
        renderGroup("grid-board", BOXES.board, img);
        renderGroup("grid-general", BOXES.general, img);
        renderGroup("grid-partner", BOXES.partner, img);
        loading.classList.add("hidden");
      };
      img.onerror = () => {
        loading.classList.add("hidden");
        warn.classList.remove("hidden");
      };
    }

    buildLogoWall();
  </script>
</body>
</html>
