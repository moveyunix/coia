<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新闻详情 - COIA</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#10233f;
      --muted:#4f647d;
      --brand:#10bcd6;
      --brand-dark:#0a7fa0;
      --line:#d9e3ef;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:0;font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;background:var(--bg);color:var(--text);}
    a{text-decoration:none;color:inherit}
    .container{width:min(1120px,92%);margin:0 auto}
    .header{
      background:linear-gradient(135deg, #102544 0%, #0c1a31 45%, #153763 100%);
      color:#fff;padding:32px 0 40px;
      border-bottom:1px solid rgba(255,255,255,.1);
    }
    .header-inner{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:16px;
    }
    .header-left{
      flex:1;
    }
    .header-left h1{margin:0;font-size:1.8rem}
    .back-link{
      display:inline-block;margin-bottom:12px;color:#10bcd6;
      border:1px solid #10bcd6;border-radius:999px;padding:6px 16px;
      font-size:.85rem;transition:.2s;
    }
    .back-link:hover{background:rgba(16,188,214,.1)}
    .lang-btn-header{
      background:rgba(255,255,255,.2);
      border:1px solid rgba(255,255,255,.4);
      border-radius:999px;
      padding:8px 18px;
      cursor:pointer;
      font-weight:600;
      color:#fff;
      font-size:.9rem;
      transition:all 0.2s ease;
    }
    .lang-btn-header:hover{
      background:rgba(255,255,255,.3);
      border-color:var(--brand);
    }
    .article{
      background:var(--card);border-radius:20px;padding:40px;
      margin:40px 0;box-shadow:0 4px 20px rgba(0,0,0,.04);
    }
    .article h1{
      font-size:1.8rem;margin:0 0 16px;color:var(--text);
    }
    .article-date{
      color:var(--brand-dark);font-size:.9rem;margin-bottom:24px;display:block;
      padding-bottom:16px;border-bottom:1px solid var(--line);
    }
    .article-content{
      color:var(--text);line-height:1.8;
    }
    .article-content h2{
      font-size:1.4rem;margin:32px 0 16px;color:var(--text);
    }
    .article-content h3{
      font-size:1.2rem;margin:24px 0 12px;color:var(--text);
    }
    .article-content p{
      margin:0 0 16px;color:var(--muted);
    }
    .article-content .highlight{
      background:#f0f7fc;padding:20px 24px;border-radius:12px;
      margin:24px 0;border-left:4px solid var(--brand);
    }
    .image-wrapper{
      margin:24px 0;
      text-align:center;
      background:#f8fafc;
      border-radius:16px;
      padding:20px;
      border:1px solid var(--line);
    }
    .image-wrapper img{
      max-width:100%;
      height:auto;
      border-radius:12px;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
    }
    .image-caption{
      margin-top:12px;
      font-size:.85rem;
      color:var(--muted);
      text-align:center;
    }
    .footer{
      background:#0a1830;color:#b8c9e5;padding:24px 0;text-align:center;margin-top:20px;
    }
    @media (max-width:700px){
      .article{padding:24px;}
      .article h1{font-size:1.4rem;}
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="container">
      <div class="header-inner">
        <div class="header-left">
          <a href="news.html" class="back-link" data-i18n="backLink">← 返回新闻列表</a>
          <h1 data-i18n="pageTitle">新闻详情</h1>
        </div>
        <button class="lang-btn-header" id="langBtn">EN</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="article" id="articleContent">
      <!-- 动态加载内容 -->
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p data-i18n="footText">© 2026 COIA. 保留所有权利。</p>
    </div>
  </footer>

  <script>
    const detailData = {
      zh: {
        title: "开放智算产业联盟联合承办ITU国际标准会议，彰显中国科技力量",
        date: "2026年9月22日",
        content: `
          <p>近日，在联合国AI标准与治理体系框架之下，由<strong>开放智算产业联盟（COIA）</strong>联合<strong>中兴通讯</strong>等单位共同承办的 <strong>ITU FG-AINN 国际标准专题会议</strong>顺利举行。产业思想研讨与联合国体系下国际标准创制同频共振，充分展现中国科技产业参与全球治理、引领人工智能产业发展的责任与担当。</p>
          
          <p>与此同时，同期论坛——<strong>“擘画 AI 原生的产业新未来｜AgentCon 北京站”</strong>亦圆满收官，汇聚全球产业智慧，开展高水平思想交流。</p>
          
          <!-- 大会合影图片 -->
          <div class="image-wrapper">
            <img src="itu_group_photo.jpg" alt="ITU FG-AINN国际标准专题会议大会合影" onerror="this.src='https://via.placeholder.com/800x500?text=ITU+FG-AINN+Group+Photo';this.onerror=null;" />
            <div class="image-caption">📸 ITU FG-AINN国际标准专题会议大会合影</div>
          </div>

          <h2>🧠 AgentCon 北京站：擘画 AI 原生产业新未来</h2>
          <p>立足全球人工智能变革浪潮，AgentCon 北京站论坛以 <strong>“擘画 AI 原生的产业新未来”</strong> 为核心主题，搭建起高水平产业对话平台。各界专家、产业代表齐聚现场，围绕 AI 原生技术演进、智能 Agent 落地实践、产业生态构建等关键议题深度思辨，碰撞前沿思想火花，研判行业发展方向，为人工智能产业高质量发展凝聚广泛产业共识，为技术创新与商业落地提供宝贵思路参考。</p>

          <h2>🌐 ITU FG-AINN 标准会议：中国力量深度参与全球治理</h2>
          <p>紧随论坛的思想激荡，联合国国际电联 <strong>ITU FG-AINN 标准会议</strong>接续启幕。本次会议置于联合国标准化体系架构之内，面向全球人工智能网络领域标准化建设重大命题，聚力构建开放、公平、普惠的国际规则体系。</p>
          <p>中国移动、中国电信、中国联通、华为、新华三、中兴通讯等国内龙头企业积极投身标准建设，踊跃提交高质量技术文稿，输出源于中国产业实践的技术方案，会议形成一系列丰硕实质性成果。中国产业力量主动发声、深度贡献，推动产业实践转化为国际标准输入，有力践行联合国框架下的标准引领，助力把中国技术经验上升为全球共享的规范参考。</p>

          <h2>🔗 论坛与标准会议双向赋能</h2>
          <p>论坛思想交流与 ITU 国际标准会议一体联动，实现产业前沿洞察与国际规则制定双向赋能：论坛沉淀产业共识，为标准研制供给现实产业土壤；国际标准会议输出规范成果，反过来牵引产业技术迭代升级。这正是我国科技产业深度参与全球数字治理的生动实践。</p>

          <div class="highlight">
            <strong>📌 未来展望</strong>
            <p style="margin-top:8px;">开放智算产业联盟秘书长孟伟表示：“面向未来，开放智算产业联盟（COIA）将持续携手产业链生态伙伴，深度扎根联合国国际电联等多边平台，牢牢把握 AI 原生时代发展机遇。坚持以产业创新驱动标准创新，以国际标准反哺产业升级，持续输出中国智慧、中国方案，不断强化在全球人工智能领域的标准引领作用，为全球数字经济与人工智能产业协同发展贡献更大力量。”</p>
          </div>
        `
      },
      en: {
        title: "COIA Co-Hosts ITU International Standards Meeting, Showcasing China's Tech Strength",
        date: "October 9, 2026",
        content: `
          <p>Recently, under the UN AI standards and governance framework, the <strong>ITU FG-AINN international standards thematic meeting</strong>, co-hosted by <strong>COIA</strong> and <strong>ZTE</strong> along with other organizations, was successfully held. The industrial discussion resonated with international standards development under the UN system, fully demonstrating the responsibility and commitment of China's tech industry in global governance and AI development.</p>
          
          <p>The concurrent forum — <strong>“Shaping a New Future for AI-Native Industry | AgentCon Beijing”</strong> — also concluded successfully, bringing together global industry wisdom for high-level exchange.</p>
          
          <!-- Group Photo -->
          <div class="image-wrapper">
            <img src="itu_group_photo.jpg" alt="ITU FG-AINN International Standards Meeting Group Photo" onerror="this.src='https://via.placeholder.com/800x500?text=ITU+FG-AINN+Group+Photo';this.onerror=null;" />
            <div class="image-caption">📸 ITU FG-AINN International Standards Meeting Group Photo</div>
          </div>

          <h2>🧠 AgentCon Beijing: Shaping a New AI-Native Future</h2>
          <p>The AgentCon Beijing forum, themed <strong>“Shaping a New Future for AI-Native Industry,”</strong> served as a high-level industry dialogue platform. Experts and industry representatives gathered to discuss AI-native technology evolution, agent implementation practices, and ecosystem building, building broad consensus for high-quality AI industry development.</p>

          <h2>🌐 ITU FG-AINN Standards Meeting: China's Deep Engagement in Global Governance</h2>
          <p>Following the forum, the UN International Telecommunication Union <strong>ITU FG-AINN standards meeting</strong> commenced. The meeting focused on major standardization topics in the global AI networking field, aiming to build an open, fair, and inclusive international rules system.</p>
          <p>Leading Chinese enterprises including China Mobile, China Telecom, China Unicom, Huawei, H3C, and ZTE actively participated in standards development, submitting high-quality technical contributions and outputting solutions rooted in China's industrial practices. The meeting achieved substantial results. China's industry forces spoke up and contributed deeply, translating industrial practices into international standards input and helping elevate China's technical experience to globally shared normative references.</p>

          <h2>🔗 Forum and Standards Meeting: Mutual Empowerment</h2>
          <p>The forum and the ITU standards meeting were integrated, enabling mutual empowerment between industrial insights and international rule-making: the forum precipitated industry consensus to provide real-world industrial soil for standards development; the standards meeting output normative results to guide industrial technology iteration and upgrading. This is a vivid practice of China's tech industry deeply participating in global digital governance.</p>

          <div class="highlight">
            <strong>📌 Future Outlook</strong>
            <p style="margin-top:8px;">Meng Wei, Secretary-General of COIA, stated: “Looking ahead, COIA will continue to work with ecosystem partners, deeply rooted in multilateral platforms such as ITU, to seize opportunities in the AI-native era. We will persist in driving standards innovation through industrial innovation, feeding standards back into industrial upgrading, continuously contributing Chinese wisdom and solutions, and strengthening our standard-setting leadership in the global AI field, contributing greater strength to the coordinated development of the global digital economy and AI industry.”</p>
          </div>
        `
      }
    };

    let lang = "zh";

    function getUrlParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function renderDetail() {
      const container = document.getElementById("articleContent");
      if (!container) return;
      
      const data = detailData[lang];
      container.innerHTML = `
        <h1>${data.title}</h1>
        <div class="article-date">📅 ${data.date}</div>
        <div class="article-content">${data.content}</div>
      `;
    }

    function renderText() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        const texts = {
          zh: {
            backLink: "← 返回新闻列表",
            pageTitle: "新闻详情",
            footText: "© 2026 COIA. 保留所有权利。"
          },
          en: {
            backLink: "← Back to News",
            pageTitle: "News Detail",
            footText: "© 2026 COIA. All rights reserved."
          }
        };
        if (texts[lang][key]) {
          el.textContent = texts[lang][key];
        }
      });
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = lang === "zh" ? "新闻详情 - COIA" : "News Detail - COIA";
      document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中";
      renderDetail();
    }

    const urlLang = getUrlParam('lang');
    if (urlLang && (urlLang === 'zh' || urlLang === 'en')) {
      lang = urlLang;
    } else {
      const savedLang = localStorage.getItem('coia_lang');
      if (savedLang && (savedLang === 'zh' || savedLang === 'en')) {
        lang = savedLang;
      }
    }
    
    renderText();

    document.getElementById("langBtn").addEventListener("click", () => {
      lang = lang === "zh" ? "en" : "zh";
      renderText();
      localStorage.setItem('coia_lang', lang);
      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('lang', lang);
      window.history.replaceState({}, '', newUrl);
    });
  </script>
</body>
</html>
