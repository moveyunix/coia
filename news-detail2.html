<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新闻详情 - COIA</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#10233f;
      --muted:#4f647d;
      --brand:#10bcd6;
      --brand-dark:#0a7fa0;
      --line:#d9e3ef;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:0;font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;background:var(--bg);color:var(--text);}
    a{text-decoration:none;color:inherit}
    .container{width:min(1120px,92%);margin:0 auto}
    .header{
      background:linear-gradient(135deg, #102544 0%, #0c1a31 45%, #153763 100%);
      color:#fff;padding:32px 0 40px;
      border-bottom:1px solid rgba(255,255,255,.1);
    }
    .header h1{margin:0 0 8px;font-size:1.8rem}
    .back-link{
      display:inline-block;margin-bottom:20px;color:#10bcd6;
      border:1px solid #10bcd6;border-radius:999px;padding:6px 16px;
      font-size:.85rem;transition:.2s;
    }
    .back-link:hover{background:rgba(16,188,214,.1)}
    .article{
      background:var(--card);border-radius:20px;padding:40px;
      margin:40px 0;box-shadow:0 4px 20px rgba(0,0,0,.04);
    }
    .article h1{
      font-size:1.8rem;margin:0 0 16px;color:var(--text);
    }
    .article-date{
      color:var(--brand-dark);font-size:.9rem;margin-bottom:24px;display:block;
      padding-bottom:16px;border-bottom:1px solid var(--line);
    }
    .article-content{
      color:var(--text);line-height:1.8;
    }
    .article-content h2{
      font-size:1.4rem;margin:32px 0 16px;color:var(--text);
    }
    .article-content h3{
      font-size:1.2rem;margin:24px 0 12px;color:var(--text);
    }
    .article-content p{
      margin:0 0 16px;color:var(--muted);
    }
    .article-content .speech{
      background:#f0f7fc;padding:20px 24px;border-radius:12px;
      margin:24px 0;border-left:4px solid var(--brand);
    }
    .image-wrapper{
      margin:24px 0;
      text-align:center;
      background:#f8fafc;
      border-radius:16px;
      padding:20px;
      border:1px solid var(--line);
    }
    .image-wrapper img{
      max-width:100%;
      height:auto;
      border-radius:12px;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
    }
    .image-caption{
      margin-top:12px;
      font-size:.85rem;
      color:var(--muted);
      text-align:center;
    }
    .footer{
      background:#0a1830;color:#b8c9e5;padding:24px 0;text-align:center;margin-top:20px;
    }
    .lang-btn{
      position:fixed;bottom:20px;right:20px;
      background:var(--brand);color:#062430;border:none;border-radius:40px;
      padding:10px 18px;cursor:pointer;font-weight:700;z-index:100;
      box-shadow:0 2px 8px rgba(0,0,0,.15);
    }
    @media (max-width:700px){
      .article{padding:24px;}
      .article h1{font-size:1.4rem;}
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="container">
      <a href="news.html" class="back-link" data-i18n="backLink">← 返回新闻列表</a>
      <h1 data-i18n="pageTitle">新闻详情</h1>
    </div>
  </div>

  <div class="container">
    <div class="article" id="articleContent">
      <!-- 动态加载内容 -->
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p data-i18n="footText">© 2026 COIA. 保留所有权利。</p>
    </div>
  </footer>

  <button class="lang-btn" id="langBtn">EN</button>

  <script>
    const detailData = {
      zh: {
        title: "开放智算产业联盟携手联合国AI for Good全球峰会发起OPEA竞赛",
        date: "2025年7月9日",
        content: `
          <p>2025年7月9日，开放智算产业联盟联合"AIGC青年大学生就业创业促进行动执委会"，在联合国AI for Good（人工智能向善）全球峰会提交以OPEA（开放企业级AI平台）为核心的赛道提案，并于7月9日顺利完成答辩，获得大会认可。标志着OPEA作为联盟收录的开源项目，已经成为全球AI创新发展的重要组成部分。</p>
          
          <div class="image-wrapper">
            <img src="OPEA challenge pic 1.png" alt="OPEA Competition" onerror="this.src='https://via.placeholder.com/800x500?text=OPEA+Challenge';this.onerror=null;" />
            <div class="image-caption">📺 OPEA竞赛现场</div>
          </div>
          
          <h2>🎯 OPEA赛道：推动生成式AI在企业场景中的落地应用</h2>
          <p>OPEA（Open Platform for Enterprise AI）是一个开源AI平台，旨在支持模块化、可组合、并具备生产就绪能力的生成式AI系统的快速开发与部署。此次提交的赛道聚焦于"生成式AI在企业级场景中的应用创新挑战"，旨在通过OPEA平台为企业提供高效、可扩展的AI解决方案。</p>
          
          <div class="image-wrapper">
            <img src="OPEA challenge pic 2.png" alt="AI for Good Global Summit" onerror="this.src='https://via.placeholder.com/800x500?text=AI+for+Good+Summit';this.onerror=null;" />
            <div class="image-caption">🌍 AI for Good Global Summit 2025</div>
          </div>
          
          <p>大赛赛道的核心任务包括设计、原型开发和展示能够解决真实企业需求的生成式AI应用。参与者需利用OPEA平台的模块化架构（如大语言模型、向量数据库、提示引擎和编排管道），开发出适用于教育、金融、医疗、制造、公共服务等垂直领域的AI解决方案。赛道特别强调应用的可用性、部署准备度、优化效果以及以用户为中心的设计，而非单纯追求模型规模或训练复杂度。</p>
          
          <h2>🌐 开放创新与国际认可</h2>
          <p>OPEA作为联盟收录的开源项目，其灵活的架构和丰富的工具链得到了与会评审的一致认可。这一赛道的提出，填补了当前生成式AI更多聚焦前端创意内容而忽视后端企业级部署的空白，推动了从技术创新到实际生产力转化的关键一步。</p>
          
          <p>此次峰会上，开放智算产业联盟秘书长孟伟通过提案详细阐述了OPEA平台的技术优势、行业价值以及全球化发展潜力，并展示了联盟在推动开源生态建设、赋能企业AI转型方面所取得的成果。评审团高度评价了赛道设计的实用性和创新性，认为其不仅能够为全球开发者社区提供重要的学习和实践平台，还能为企业级AI应用的推广和普及注入新的活力。</p>
          
          <h2>🚀 生成式AI赋能未来产业</h2>
          <p>通过本次提案，OPEA不仅得到了联合国AI for Good全球峰会的认可，也进一步扩大了其国际影响力。未来，开放智算产业联盟将继续推动OPEA的生态建设，吸引更多开发者参与，同时与全球企业和高校合作，共同探索生成式AI的更多可能性，助力全球数字化转型和产业升级。</p>
          
          <div class="speech">
            <strong>📢 总结展望</strong>
            <p style="margin-top:8px;">作为开放智算产业联盟的一项重要成果，OPEA赛道的成功不仅是对联盟创新能力的肯定，更是联盟开源力量在国际舞台上的一次展示。开放智算产业联盟将秉持开放合作的理念，与全球伙伴携手，共同开创智能产业的美好未来。</p>
          </div>
        `
      },
      en: {
        title: "COIA Launches OPEA Competition at UN AI for Good Global Summit",
        date: "July 9, 2025",
        content: `
          <p>On July 9, 2025, COIA, in collaboration with the "AIGC Youth Employment and Entrepreneurship Action Committee," submitted a track proposal centered on OPEA (Open Platform for Enterprise AI) at the UN AI for Good Global Summit. After a successful defense, the proposal received recognition from the conference, marking OPEA as a key component of global AI innovation.</p>
          
          <div class="image-wrapper">
            <img src="OPEA challenge pic 1.png" alt="OPEA Competition" onerror="this.src='https://via.placeholder.com/800x500?text=OPEA+Challenge';this.onerror=null;" />
            <div class="image-caption">📺 OPEA Competition Scene</div>
          </div>
          
          <h2>🎯 OPEA Track: Driving GenAI Adoption in Enterprise Scenarios</h2>
          <p>OPEA (Open Platform for Enterprise AI) is an open-source AI platform designed to support the rapid development and deployment of modular, composable, and production-ready generative AI systems. The submitted track focuses on "Innovation Challenges for Generative AI in Enterprise Scenarios," aiming to provide efficient and scalable AI solutions for businesses through the OPEA platform.</p>
          
          <div class="image-wrapper">
            <img src="OPEA challenge pic 2.png" alt="AI for Good Global Summit" onerror="this.src='https://via.placeholder.com/800x500?text=AI+for+Good+Summit';this.onerror=null;" />
            <div class="image-caption">🌍 AI for Good Global Summit 2025</div>
          </div>
          
          <p>The core tasks of the competition include designing, prototyping, and demonstrating generative AI applications that address real business needs. Participants are required to leverage OPEA's modular architecture (including LLMs, vector databases, prompt engines, and orchestration pipelines) to develop AI solutions applicable to vertical domains such as education, finance, healthcare, manufacturing, and public services. The track emphasizes application usability, deployment readiness, optimization effectiveness, and user-centric design, rather than merely pursuing model scale or training complexity.</p>
          
          <h2>🌐 Open Innovation and International Recognition</h2>
          <p>OPEA's flexible architecture and rich toolchain received unanimous recognition from the review committee. This track proposal fills the gap where generative AI has primarily focused on front-end creative content while neglecting back-end enterprise deployment, marking a key step in transforming technological innovation into actual productivity.</p>
          
          <p>At the summit, Meng Wei, Secretary-General of COIA, elaborated on OPEA's technical advantages, industry value, and global development potential, while showcasing the alliance's achievements in promoting open-source ecosystem development and enabling enterprise AI transformation. The judging panel highly praised the practicality and innovation of the track design, recognizing it as an important platform for global developer communities and a catalyst for promoting enterprise AI applications.</p>
          
          <h2>🚀 GenAI Empowering Future Industries</h2>
          <p>Through this proposal, OPEA has not only gained recognition from the UN AI for Good Global Summit but has also expanded its international influence. Going forward, COIA will continue to promote OPEA's ecosystem development, attract more developers, and collaborate with global enterprises and universities to explore further possibilities for generative AI, contributing to global digital transformation and industrial upgrading.</p>
          
          <div class="speech">
            <strong>📢 Conclusion</strong>
            <p style="margin-top:8px;">As a significant achievement of COIA, the success of the OPEA track is not only a validation of the alliance's innovation capabilities but also a demonstration of open-source power on the international stage. COIA will uphold the principles of open collaboration and work with global partners to create a bright future for the intelligent industry.</p>
          </div>
        `
      }
    };

    let lang = "zh";

    function getUrlParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function renderDetail() {
      const container = document.getElementById("articleContent");
      if (!container) return;
      
      const data = detailData[lang];
      container.innerHTML = `
        <h1>${data.title}</h1>
        <div class="article-date">📅 ${data.date}</div>
        <div class="article-content">${data.content}</div>
      `;
    }

    function renderText() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        const texts = {
          zh: {
            backLink: "← 返回新闻列表",
            pageTitle: "新闻详情",
            footText: "© 2026 COIA. 保留所有权利。"
          },
          en: {
            backLink: "← Back to News",
            pageTitle: "News Detail",
            footText: "© 2026 COIA. All rights reserved."
          }
        };
        if (texts[lang][key]) {
          el.textContent = texts[lang][key];
        }
      });
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = lang === "zh" ? "新闻详情 - COIA" : "News Detail - COIA";
      document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中";
      renderDetail();
    }

    const urlLang = getUrlParam('lang');
    if (urlLang && (urlLang === 'zh' || urlLang === 'en')) {
      lang = urlLang;
    } else {
      const savedLang = localStorage.getItem('coia_lang');
      if (savedLang && (savedLang === 'zh' || savedLang === 'en')) {
        lang = savedLang;
      }
    }
    
    renderText();

    document.getElementById("langBtn").addEventListener("click", () => {
      lang = lang === "zh" ? "en" : "zh";
      renderText();
      localStorage.setItem('coia_lang', lang);
      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('lang', lang);
      window.history.replaceState({}, '', newUrl);
    });
  </script>
</body>
</html>
